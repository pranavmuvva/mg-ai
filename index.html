<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MG AI — The Muvva Group</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f8fafc; max-width: 700px; margin: 40px auto; padding: 20px; }
    h1 { color: #38bdf8; margin-bottom: 5px; }
    .sub { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    input, textarea { width: 100%; background: #1e293b; color: white; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 12px; box-sizing: border-box; }
    button { background: #38bdf8; color: #0f172a; font-weight: bold; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
    button:hover { background: #7dd3fc; }
    #chat { background: #1e293b; border-radius: 8px; padding: 15px; min-height: 220px; max-height: 420px; overflow-y: auto; margin-bottom: 12px; white-space: pre-wrap; line-height: 1.5; }
    .user { color: #38bdf8; font-weight: bold; margin-bottom: 6px; }
    .ai { color: #e2e8f0; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>MG AI ✨</h1>
  <div class="sub">Developed by The Muvva Group (MG) • Intelligent Assistant</div>

  <input type="password" id="apiKey" placeholder="Paste your free Gemini API Key here (saved locally in your browser)">
  <textarea id="instructions" rows="2" placeholder="Custom Instructions (Optional): Tell MG AI how to respond (e.g., 'Keep answers short and clear.')"></textarea>
  <button onclick="saveSettings()">Save Settings</button>

  <hr style="border-color: #334155; margin: 20px 0;">

  <div id="chat"></div>
  <input type="text" id="prompt" placeholder="Ask MG AI anything..." onkeydown="if(event.key==='Enter') sendMessage()">
  <button onclick="sendMessage()">Send</button>

  <script>
    document.getElementById('apiKey').value = localStorage.getItem('mg_ai_key') || '';
    document.getElementById('instructions').value = localStorage.getItem('mg_ai_instructions') || '';

    function saveSettings() {
      localStorage.setItem('mg_ai_key', document.getElementById('apiKey').value.trim());
      localStorage.setItem('mg_ai_instructions', document.getElementById('instructions').value.trim());
      alert('MG AI Settings Saved!');
    }

    async function sendMessage() {
      const key = document.getElementById('apiKey').value.trim();
      const instructions = document.getElementById('instructions').value.trim();
      const promptInput = document.getElementById('prompt');
      const userText = promptInput.value.trim();
      if (!key || !userText) return alert('Please enter your API key and a message!');

      const chat = document.getElementById('chat');
      chat.innerHTML += '<div class="user">You: ' + userText + '</div>';
      promptInput.value = '';

      const systemContext = 'You are MG AI, a helpful, fast, and smart artificial intelligence assistant developed by The Muvva Group (MG). ' + (instructions ? 'User Custom Instructions: ' + instructions : '');
      const fullPrompt = systemContext + '\n\nUser Message:\n' + userText;
      const endpoint = 'https://googleapis.com' + encodeURIComponent(key);

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: fullPrompt }] }]
          })
        });
        const data = await res.json();
        let reply = 'Error: Unknown response.';
        if (data.candidates && data.candidates.length > 0) {
          reply = data.candidates[0].content.parts[0].text;
        } else if (data.error) {
          reply = 'API Error: ' + data.error.message;
        }
        chat.innerHTML += '<div class="ai">MG AI: ' + reply + '</div>';
        chat.scrollTop = chat.scrollHeight;
      } catch (err) {
        chat.innerHTML += '<div class="ai">Error details: ' + err.message + '</div>';
      }
    }
  </script>
</body>
</html>
